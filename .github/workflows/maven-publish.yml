name: Docker Build and Test

# Trigger workflow on push or pull request to the default branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub (optional, if you plan to push the image to Docker Hub)
      # Uncomment and set secrets if needed
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t springboot-app .

      # Step 5: Run the container for testing
      - name: Run Docker container
        run: |
          docker run --name springboot-container -d springboot-app
          sleep 10 # Wait for the application to start

      # Step 6: Run tests inside the container
      - name: Run tests
        run: |
          docker exec springboot-container mvn test

#      # Step 7: Stop and remove the container
#      - name: Clean up
#        run: |
#          docker stop springboot-container
#          docker rm springboot-container
