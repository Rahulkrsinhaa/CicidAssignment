name: Docker Build and Test

on:
  push:
    branches:
      - fature_employee
  pull_request:
    branches:
      - fature_employee

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java 11 for Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin' # Use Eclipse Temurin distribution

      # Step 3: Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Step 4: Build the Maven project
      - name: Build with Maven
        run: mvn clean package --batch-mode

      # Step 5: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t springboot-app .

      # Step 6: Run the container for testing
      - name: Run Docker container
        run: |
          docker run --name springboot-container -d springboot-app
          sleep 10 # Wait for the application to start

      # Step 7: Run tests inside the container
      - name: Run tests
        run: |
          docker exec springboot-container mvn test

      # Step 8: Stop and remove the container
      - name: Clean up
        run: |
          docker stop springboot-container
          docker rm springboot-container
