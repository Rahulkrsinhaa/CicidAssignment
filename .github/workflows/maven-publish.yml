name: Java Maven CI/CD

# Trigger workflow on push to the main branch
on:
  push:
    branches:
      - 'fature_employee'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout code from the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up Java 11
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin' # Use Eclipse Temurin distribution

    # Cache Maven dependencies to speed up builds
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    # Build the Maven project
    - name: Build with Maven
      run: mvn clean install --batch-mode

    # Optional: Run tests
    - name: Run tests
      run: mvn test

    # Optional: Deploy artifacts (you can customize this step as needed)
    - name: Deploy artifacts
      if: success()
      run: echo "Artifacts deployed. Add your deployment script here."

    # Notification or post-build actions (if needed)
